<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kranti — Dashboard</title>
<link rel="stylesheet" href="css/old-school.css">
</head>
<body>
<div class="app-window">
  <div class="titlebar">
    <span class="icon"></span>
    <span class="title-text">Kranti Business Suite — Advanced Dashboard</span>

  </div>
  <div class="toolbar" id="navToolbar"></div>

  <div class="content">
    <h2 class="section-title">Dashboard Overview</h2>

    <div class="stat-grid" id="statGrid"></div>

    <div class="field-grid" style="grid-template-columns: 1.3fr 1fr; gap:14px;">
      <fieldset>
        <legend>Deal Status Breakdown</legend>
        <table class="grid" id="statusTable">
          <thead><tr><th>Status</th><th>Count</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </fieldset>

      <fieldset>
        <legend>Recent Activity</legend>
        <table class="grid" id="activityTable">
          <thead><tr><th>Order</th><th>Buyer</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </fieldset>
    </div>

    <fieldset>
      <legend>Buyer-wise Volume</legend>
      <table class="grid" id="buyerTable">
        <thead><tr><th>Buyer</th><th>Deals</th><th>Total Value (₹)</th></tr></thead>
        <tbody></tbody>
      </table>
    </fieldset>
  </div>

  <div class="statusbar">
    <div class="grow" id="userStatus">Ready</div>
    <div>Kranti v0.1 Prototype</div>
    <div id="clockBox">--:--</div>
  </div>
</div>

  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/section-collapse.js"></script>
</body>
</html>
